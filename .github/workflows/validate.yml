name: Validate Application

on:
  workflow_dispatch:
    inputs:
      synthetic_mail_acceptance:
        description: 'Use the approved synthetic environment for mail acceptance; no production target'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'app/**'
      - 'streamlit_app.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'workers/**'
      - 'deploy/**'
      - 'supabase/migrations/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'streamlit_app.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'workers/**'
      - 'deploy/**'
      - 'supabase/migrations/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: pip install --require-hashes -r workers/ap_mail/requirements.lock
      - run: npm ci --prefix app/ap_statements --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix workers/ap_mail --ignore-scripts --no-audit --no-fund
      - run: node app/ap_statements/build.mjs
      - run: node workers/ap_mail/node_modules/playwright/cli.js install --with-deps chromium
      - run: python -m compileall -q app streamlit_app.py
      - run: python -m unittest discover -s tests -v
      - run: node --test --test-isolation=none tests/ap_statements*.test.mjs

  mail-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
      - run: terraform -chdir=deploy/ap_mail init -backend=false -input=false
      - run: terraform -chdir=deploy/ap_mail fmt -check
      - run: terraform -chdir=deploy/ap_mail validate
      - run: docker build -f workers/ap_mail/Dockerfile -t ap-mail-smoke .
      - run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=1g --entrypoint python ap-mail-smoke -m workers.ap_mail.smoke

  mail-synthetic:
    if: github.event_name == 'workflow_dispatch' && inputs.synthetic_mail_acceptance
    runs-on: ubuntu-latest
    environment: ap-mail-synthetic
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.AP_MAIL_WIF_PROVIDER }}
          service_account: ${{ vars.AP_MAIL_TEST_RUNNER }}
      - run: pip install --require-hashes -r workers/ap_mail/requirements.lock
      - run: python -m unittest discover -s tests -p test_ap_mail_integration.py -v
        env:
          AP_MAIL_SYNTHETIC_INTEGRATION: '1'
          AP_MAIL_SYNTHETIC_ATTESTATION: 'synthetic-only'
          AP_MAIL_ALLOW_TEST_PROJECT: ${{ vars.AP_MAIL_TEST_PROJECT_REF }}
          AP_MAIL_SUPABASE_URL: ${{ vars.AP_MAIL_TEST_SUPABASE_URL }}
          AP_MAIL_ALLOW_TEST_WORKSPACE: ${{ vars.AP_MAIL_TEST_WORKSPACE_ID }}
          AP_MAIL_WORKSPACE_ID: ${{ vars.AP_MAIL_TEST_WORKSPACE_ID }}
          AP_MAIL_CONNECTION_ID: ${{ vars.AP_MAIL_TEST_CONNECTION_ID }}
          AP_MAIL_BUCKET: ${{ vars.AP_MAIL_TEST_BUCKET }}
          AP_MAIL_SUPABASE_KEY: ${{ secrets.AP_MAIL_TEST_SUPABASE_KEY }}
          AP_MAIL_GOOGLE_PROJECT: ${{ vars.AP_MAIL_TEST_GOOGLE_PROJECT }}
          AP_MAIL_ALLOW_GOOGLE_PROJECT: ${{ vars.AP_MAIL_TEST_GOOGLE_PROJECT }}
          AP_MAIL_QUEUE: ${{ vars.AP_MAIL_TEST_QUEUE }}
          AP_MAIL_PROCESSOR_URL: ${{ vars.AP_MAIL_TEST_PROCESSOR_URL }}
          AP_MAIL_TASK_CALLER: ${{ vars.AP_MAIL_TEST_TASK_CALLER }}
          AP_MAIL_PROCESSOR_AUDIENCE: ${{ vars.AP_MAIL_TEST_PROCESSOR_AUDIENCE }}
          AP_MAIL_GMAIL_SECRET: ${{ vars.AP_MAIL_TEST_GMAIL_SECRET }}
          AP_MAIL_SYNTHETIC_MESSAGE_ID: ${{ vars.AP_MAIL_TEST_MESSAGE_ID }}

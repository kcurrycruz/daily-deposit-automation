name: Inspect AP mail runner sandbox

on:
  push:
    branches: [codex/ap-mail-linux-rollout]
    paths: [.github/workflows/ap-mail-linux-probe.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read installed sandbox metadata without credentials
        run: |
          stat -Lc '%u:%g:%a %n' /opt/google/chrome/chrome-sandbox
          namei -l /opt/google/chrome/chrome-sandbox
          dpkg-query -W google-chrome-stable
          dpkg --verify google-chrome-stable

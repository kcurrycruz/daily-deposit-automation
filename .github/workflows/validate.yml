name: Validate Python

on:
  push:
    paths:
      - 'app/**'
      - 'streamlit_app.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'streamlit_app.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/membership_payments.py app/pos_to_quickbooks_v2.py streamlit_app.py
      - run: python -m unittest tests.test_membership_payments -v
